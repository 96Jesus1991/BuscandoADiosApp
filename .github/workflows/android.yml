# ============================================================
# WORKFLOW: Build Release AAB - Buscando a Dios App
# ============================================================

name: Build Release AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-latest

    steps:
      # ========== PASO 1: Checkout ==========
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ========== PASO 2: Setup JDK ==========
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ========== PASO 3: Android SDK ==========
      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      # ========== PASO 4: Fix gradlew ==========
      - name: 🔧 Fix gradlew line endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      # ========== PASO 5: Setup Gradle ==========
      - name: 📦 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # ========== PASO 6: Verify structure ==========
      - name: 🔍 Verify project structure
        run: |
          ls -la
          ls -la app || true

      # ========== PASO 7: Build Release AAB ==========
      - name: 🏗️ Build Release AAB
        run: |
          gradle bundleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2048m -Dfile.encoding=UTF-8"

      # ========== PASO 8: List AAB ==========
      - name: 📋 List generated AAB
        run: |
          find app/build/outputs/bundle -name "*.aab" -type f || echo "No AAB found"

      # ========== PASO 9: Upload AAB ==========
      - name: 📤 Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: BuscandoADios-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # ========== PASO 10: Summary ==========
      - name: ✅ Build Summary
        if: success()
        run: |
          echo "=========================================="
          echo "✅ BUILD EXITOSO"
          ls -lh app/build/outputs/bundle/release/*.aab
          echo "=========================================="



